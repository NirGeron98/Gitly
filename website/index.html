<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Gitly guides AI coding agents through safe Git, project checks, recovery, and GitHub workflows using natural language. A vibe.md skill." />
    <meta name="theme-color" content="#fdfaf5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14171d" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" />
    <title>Gitly — Just build. Gitly handles the rest. · vibe.md</title>
    <script>
      try {
        const theme = localStorage.getItem('theme')
        if (theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark')
      } catch { /* storage unavailable: fall back to light */ }
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
